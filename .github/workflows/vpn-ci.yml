name: VPN CI

on:
  push:
    branches:
      - feature/vpn-mode
      - feature/cloudflare-backend
  pull_request:
    paths:
      - "vpn/**"
      - "relay/**"
      - "worker/**"
      - "tests/test_vpn_*.py"
      - "pyproject.toml"
      - "vpn_windows.py"
      - ".github/workflows/vpn-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install ".[dev]"

      - name: Lint VPN implementation
        run: python -m ruff check vpn relay vpn_windows.py tests/test_vpn_*.py

      - name: Compile
        run: python -m compileall -q vpn relay vpn_windows.py

      - name: Import smoke test
        run: python -c "import vpn.client, vpn.socks5, vpn.websocket, relay.server"

      - name: VPN protocol, transport and safety tests
        run: python -m unittest discover -s tests -p "test_vpn_*.py" -v

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
