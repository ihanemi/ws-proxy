name: VPN CI

on:
  push:
    branches:
      - feature/vpn-mode
  pull_request:
    paths:
      - "vpn/**"
      - "relay/**"
      - "tests/test_vpn_*.py"
      - "pyproject.toml"
      - ".github/workflows/vpn-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install .

      - name: Compile
        run: python -m compileall -q vpn relay

      - name: Import smoke test
        run: python -c "import vpn.client, vpn.socks5, vpn.websocket, relay.server"

      - name: UDP protocol tests
        run: python -m unittest discover -s tests -p "test_vpn_*.py" -v
