name: WS VPN issue guidance

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  comment:
    if: contains(github.event.issue.labels.*.name, 'bug')
    runs-on: ubuntu-latest
    steps:
      - name: Add safe diagnostic guidance
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Thanks for reporting a WS VPN problem.

            Please include:

            - the WS VPN version and Windows version;
            - whether the kill switch and IPv6 were enabled;
            - the failure stage: connect, traffic, disconnect, or recovery;
            - the relevant excerpt from **Open Logs**, after checking it for personal data;
            - whether `%ProgramData%\WsVpn\state.json` still exists (do not paste its full contents).

            If the guard remains after a crash, keep the machine offline until you have run
            `WsVpn.exe --cleanup` from an elevated terminal. Do not disable Windows Defender,
            Firewall, or TLS verification as a workaround.
