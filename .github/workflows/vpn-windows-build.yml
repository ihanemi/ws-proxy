name: VPN Windows Build

on:
  push:
    branches:
      - feature/vpn-mode
    paths:
      - "vpn/**"
      - "relay/**"
      - "scripts/windows_e2e.ps1"
      - "tests/test_vpn_*.py"
      - "vpn_windows.py"
      - "packaging/vpn_windows.spec"
      - "packaging/WsVpn.iss"
      - "pyproject.toml"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/vpn-windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-amd64:
    runs-on: windows-latest
    env:
      TUN2SOCKS_VERSION: v2.7.0
      TUN2SOCKS_SHA256: c5d46e9452f6c9cc7c15ab9158d6d6a0169ceecd6bca019ce476b49337d2be43
      WINTUN_VERSION: 0.14.1
      WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
      INNO_VERSION: 7.1.0
      INNO_TAG: is-7_1_0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui]" "pyinstaller==6.22.2"

      - name: Download verified tun2socks and Wintun
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force vendor/windows-amd64 | Out-Null

          $tunZip = Join-Path $env:RUNNER_TEMP "tun2socks.zip"
          $tunUrl = "https://github.com/xjasonlyu/tun2socks/releases/download/$env:TUN2SOCKS_VERSION/tun2socks-windows-amd64.zip"
          Invoke-WebRequest -Uri $tunUrl -OutFile $tunZip
          $tunHash = (Get-FileHash $tunZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($tunHash -ne $env:TUN2SOCKS_SHA256) {
            throw "tun2socks SHA-256 mismatch: $tunHash"
          }
          $tunDir = Join-Path $env:RUNNER_TEMP "tun2socks"
          Expand-Archive -Path $tunZip -DestinationPath $tunDir -Force
          $tunExe = Get-ChildItem $tunDir -Recurse -File -Filter "tun2socks*.exe" | Select-Object -First 1
          if (-not $tunExe) { throw "tun2socks executable not found in archive" }
          Copy-Item $tunExe.FullName vendor/windows-amd64/tun2socks.exe -Force

          $wintunZip = Join-Path $env:RUNNER_TEMP "wintun.zip"
          $wintunUrl = "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip"
          Invoke-WebRequest -Uri $wintunUrl -OutFile $wintunZip
          $wintunHash = (Get-FileHash $wintunZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($wintunHash -ne $env:WINTUN_SHA256) {
            throw "Wintun SHA-256 mismatch: $wintunHash"
          }
          $wintunDir = Join-Path $env:RUNNER_TEMP "wintun"
          Expand-Archive -Path $wintunZip -DestinationPath $wintunDir -Force
          $wintunDll = Get-ChildItem $wintunDir -Recurse -File -Filter "wintun.dll" |
            Where-Object { $_.FullName -match '[\\/]amd64[\\/]' } |
            Select-Object -First 1
          if (-not $wintunDll) { throw "AMD64 wintun.dll not found in official archive" }
          Copy-Item $wintunDll.FullName vendor/windows-amd64/wintun.dll -Force

      - name: Compile and unit tests
        shell: pwsh
        run: |
          python -m compileall -q vpn relay
          python -m unittest discover -s tests -p "test_vpn_*.py" -v
          python -c "import vpn.gui, vpn.settings"

      - name: Verify Windows DPAPI token storage
        shell: pwsh
        run: |
          python -c "from vpn.settings import protect_token, unprotect_token; value=protect_token('ci-secret-token'); assert 'ci-secret-token' not in value; assert unprotect_token(value) == 'ci-secret-token'"

      - name: Validate PowerShell E2E script syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\scripts\windows_e2e.ps1),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Build standalone GUI EXE
        shell: pwsh
        run: python -m PyInstaller packaging/vpn_windows.spec --noconfirm --clean

      - name: Smoke test executable CLI path
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\WsVpn.exe -ArgumentList "--help" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WsVpn.exe --help smoke test failed: $($p.ExitCode)" }

      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION-x64.exe"
          $url = "https://github.com/jrsoftware/issrc/releases/download/$env:INNO_TAG/innosetup-$env:INNO_VERSION-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne "Valid") {
            throw "Inno Setup Authenticode signature is not valid: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notmatch "Pyrsys B\.V\.") {
            throw "Unexpected Inno Setup signer: $($signature.SignerCertificate.Subject)"
          }
          $installDir = Join-Path $env:RUNNER_TEMP "InnoSetup7"
          $proc = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
          ) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Inno Setup install failed: $($proc.ExitCode)" }
          $iscc = Get-ChildItem $installDir -Recurse -File -Filter ISCC.exe | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found" }
          $iscc.FullName | Set-Content -NoNewline $env:RUNNER_TEMP\iscc-path.txt

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Get-Content $env:RUNNER_TEMP\iscc-path.txt
          & $iscc .\packaging\WsVpn.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed: $LASTEXITCODE" }
          if (-not (Test-Path .\dist\WsVpn-Setup-x64.exe)) { throw "Installer output not found" }

      - name: Generate checksums
        shell: pwsh
        run: |
          foreach ($file in @("WsVpn.exe", "WsVpn-Setup-x64.exe")) {
            $path = Join-Path .\dist $file
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file" | Set-Content -NoNewline "$path.sha256"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: WsVpn-windows-amd64
          path: |
            dist/WsVpn.exe
            dist/WsVpn.exe.sha256
            dist/WsVpn-Setup-x64.exe
            dist/WsVpn-Setup-x64.exe.sha256
            THIRD_PARTY_NOTICES.md
            scripts/windows_e2e.ps1
          if-no-files-found: error
