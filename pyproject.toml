[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "ws-vpn"
version = "0.1.0"
description = "System-wide Windows VPN tunnel over authenticated WebSocket relay"
readme = "README.vpn.md"
requires-python = ">=3.10"
license = { name = "MIT", file = "LICENSE" }
authors = [{ name = "ihanemi" }]
keywords = ["vpn", "websocket", "wintun", "tun2socks", "socks5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Topic :: System :: Networking",
]
dependencies = [
  "websockets>=15.0,<16",
]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1"]
gui = [
  "Pillow>=11.0,<13",
  "pystray>=0.19.5,<0.20",
]

[project.scripts]
ws-vpn = "vpn.client:main"
ws-vpn-relay = "relay.server:main"

[project.urls]
Source = "https://github.com/ihanemi/ws-proxy"

[tool.hatch.build.targets.wheel]
packages = ["vpn", "relay"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4"]
